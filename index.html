<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vitals">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="A local-only personal and family medical record book. No server, no account.">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Vitals Journal</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --sunk:#F2F2F7; --line:#E5E5EA; --line-soft:#EFEFF2;
  --ink:#1C1C1E; --ink-body:#3C3C43; --ink-muted:#8E8E93;
  --blue:#007AFF;  --blue-bg:#E8F1FE;  --blue-ink:#0060DF;  --blue-line:#CFE3FD;
  --green:#34C759; --green-bg:#E6F7EB; --green-ink:#1E7F3C; --green-line:#BFE9CC;
  --amber:#FF9500; --amber-bg:#FFF4E5; --amber-ink:#8A5200; --amber-line:#F6DFBC;
  --red:#FF3B30;   --red-bg:#FFEBE9;   --red-ink:#C4271D;   --red-line:#F7D2CE;
  --r-card:12px; --r-inner:8px; --r-pill:12px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --sans:-apple-system,BlinkMacSystemFont,"San Francisco","Helvetica Neue",Helvetica,Ubuntu,Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink-body); font-family:var(--sans); font-size:14px; line-height:1.5; margin:0; -webkit-text-size-adjust:100%}
h1,h2,h3{margin:0; color:var(--ink); text-wrap:balance}
h1{font-size:28px; font-weight:600; letter-spacing:-.021em}
h2{font-size:20px; font-weight:500; letter-spacing:-.012em}
h3{font-size:16px; font-weight:600}
p{margin:0}
button{font:inherit; color:inherit}
input,select,textarea{font:inherit; color:var(--ink)}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-muted)}
.cap{font-size:12px; color:var(--ink-muted)}
.kick{font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase}

/* shell */
.wrap{max-width:1080px; margin:0 auto; padding-inline:var(--s4); padding-block:0 96px}
header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--bg); border-bottom:1px solid var(--line)}
.top-in{max-width:1080px; margin:0 auto; padding:var(--s3) var(--s4); display:flex; gap:var(--s3); align-items:center; flex-wrap:wrap}
.top-in h1{font-size:19px; margin-right:auto}
.people{display:flex; gap:var(--s1); flex-wrap:wrap}
.pbtn{border:1px solid var(--line); background:var(--card); border-radius:var(--r-pill); padding:5px 10px; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:6px}
.pbtn[aria-pressed="true"]{background:var(--blue-bg); border-color:var(--blue-line); color:var(--blue-ink); font-weight:600}
.pbtn .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
nav.tabs{display:flex; gap:var(--s1); overflow-x:auto; border-bottom:1px solid var(--line); margin-bottom:var(--s5); scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0; background:none; padding:var(--s3) var(--s3) 10px; cursor:pointer; white-space:nowrap; font-size:14px; color:var(--ink-muted); border-bottom:2px solid transparent; margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--blue-ink); border-bottom-color:var(--blue); font-weight:600}
.tab .c{font-size:12px; margin-left:5px; opacity:.75}

/* blocks */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:var(--s5)}
.card+.card{margin-top:var(--s4)}
.sec{margin-bottom:var(--s6)}
.sec>h2{margin-bottom:var(--s3)}
.grid{display:grid; gap:var(--s4)}
.g180{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g240{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g300{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.row{display:flex; gap:var(--s2); flex-wrap:wrap; align-items:center}
.btn{border:1px solid var(--line); background:var(--card); border-radius:var(--r-inner); padding:8px 14px; cursor:pointer; font-size:14px; font-weight:500; color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--blue); border-color:var(--blue); color:#fff}
.btn.pri:hover{background:var(--blue-ink)}
.btn.warn{color:var(--red-ink); border-color:var(--red-line)}
.btn.warn:hover{background:var(--red-bg)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.sm{padding:4px 10px; font-size:13px}
.btn.big{padding:14px 18px; font-size:16px; width:100%; justify-content:center}
label.fl{display:block; font-size:12px; font-weight:600; color:var(--ink-muted); margin-bottom:var(--s1)}
.inp{width:100%; border:1px solid var(--line); border-radius:var(--r-inner); padding:9px 10px; background:var(--card); font-size:15px}
.inp:focus{border-color:var(--blue); outline:none}
textarea.inp{font-family:var(--mono); font-size:13px; line-height:1.55}
.hint{font-size:12px; color:var(--ink-muted); margin-top:var(--s1); line-height:1.45}
.empty{border:1px dashed var(--line); border-radius:var(--r-card); padding:var(--s5); text-align:center; color:var(--ink-muted); background:var(--card)}
.empty b{display:block; color:var(--ink); font-size:16px; font-weight:600; margin-bottom:var(--s1)}

/* callout */
.callout{border-radius:var(--r-card); padding:var(--s4); border:1px solid}
.callout .kick{margin-bottom:var(--s1)}
.callout p{color:var(--ink)}
.c-blue{background:var(--blue-bg); border-color:var(--blue-line)} .c-blue .kick{color:var(--blue-ink)}
.c-amber{background:var(--amber-bg); border-color:var(--amber-line)} .c-amber .kick{color:var(--amber-ink)}
.c-red{background:var(--red-bg); border-color:var(--red-line)} .c-red .kick{color:var(--red-ink)}
.c-green{background:var(--green-bg); border-color:var(--green-line)} .c-green .kick{color:var(--green-ink)}

/* badge */
.badge{display:inline-flex; align-items:center; gap:6px; border-radius:var(--r-pill); padding:2px 8px; font-size:12px; font-weight:600; white-space:nowrap}
.badge .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.st-in_range{background:var(--green-bg); color:var(--green-ink)}
.st-watch{background:var(--amber-bg); color:var(--amber-ink)}
.st-discuss{background:var(--red-bg); color:var(--red-ink)}
.st-act{background:var(--red-bg); color:var(--red-ink)}
.st-unknown{background:var(--sunk); color:var(--ink-muted)}

/* stat tile */
.tile{background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:var(--s4)}
.tile .lab{font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-muted)}
.tile .fig{font-size:30px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink); line-height:1.15; margin-top:var(--s1)}
.tile .fig span{font-size:16px; color:var(--ink-muted); font-weight:400; margin-left:2px}
.tile .foot{font-size:12px; color:var(--ink-muted); margin-top:var(--s1)}

/* observation row */
.obs{display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:var(--s4); cursor:pointer}
.obs:hover{border-color:var(--blue-line)}
.obs.ghost{background:var(--sunk);border-style:dashed}
.obs.ghost:hover{background:var(--card)}
.obs .nm{font-size:13px; color:var(--ink-muted); margin-bottom:2px}
.obs .vl{font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink); line-height:1.15}
.obs .vl span{font-size:14px; font-weight:400; color:var(--ink-muted); margin-left:3px}
.obs .ft{font-size:12px; color:var(--ink-muted); margin-top:var(--s2); line-height:1.45}

/* band */
.band{margin:var(--s3) 0 var(--s1)}
.band .tr{position:relative; height:14px; border-radius:7px; background:var(--sunk); overflow:hidden; border:1px solid var(--line)}
.band .tr i{position:absolute; top:0; bottom:0}
.zlo{background:var(--amber-bg)} .zok{background:var(--green-bg)} .zhi{background:var(--red-bg)}
.band .mk{position:absolute; top:-4px; bottom:-4px; width:3px; border-radius:2px; background:var(--ink); box-shadow:0 0 0 2px var(--card)}
.band .tk{position:relative; height:16px; margin-top:var(--s1)}
.band .tk span{position:absolute; transform:translateX(-50%); font-size:11px; color:var(--ink-muted); white-space:nowrap; font-variant-numeric:tabular-nums}
.band .ed{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-muted); margin-bottom:3px; font-variant-numeric:tabular-nums}

/* table */
.tw{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14px; min-width:520px}
th{text-align:left; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-muted); padding:var(--s2) var(--s3); border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:var(--s3); border-bottom:1px solid var(--line-soft); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}

/* details */
details{border-top:1px solid var(--line-soft); padding-top:var(--s3); margin-top:var(--s3)}
details>summary{cursor:pointer; font-size:14px; font-weight:600; color:var(--blue-ink); list-style:none; display:flex; align-items:center; gap:var(--s2)}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:""; width:0; height:0; border-left:5px solid currentColor; border-top:4px solid transparent; border-bottom:4px solid transparent; transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details>div{margin-top:var(--s3)}

/* drawer */
.scrim{position:fixed; inset:0; background:rgba(0,0,0,.28); z-index:40}
.drawer{position:fixed; z-index:41; right:0; top:0; bottom:0; width:min(560px,100%); background:var(--card); border-left:1px solid var(--line); overflow-y:auto}
.dh{position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); padding:var(--s4); display:flex; gap:var(--s3); align-items:flex-start; z-index:2}
.db{padding:var(--s5) var(--s4) var(--s7)}
.big{font-size:40px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink); line-height:1; letter-spacing:-.02em}
dl.kv{display:grid; grid-template-columns:minmax(104px,auto) 1fr; gap:var(--s2) var(--s4); font-size:13px; margin:var(--s4) 0}
dl.kv dt{color:var(--ink-muted); font-weight:500}
dl.kv dd{margin:0; color:var(--ink); word-break:break-word}

/* confirm rows */
.crow{display:grid; grid-template-columns:auto 1fr; gap:var(--s3); padding:var(--s3) 0; border-bottom:1px solid var(--line-soft)}
.crow:last-child{border-bottom:0}
.crow.ok{background:var(--green-bg); border-radius:var(--r-inner); padding-inline:var(--s3)}
.ck{width:22px; height:22px; accent-color:var(--green); margin-top:4px; cursor:pointer; flex:none}
.cg{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:var(--s2); margin-top:var(--s2)}
.shot{width:100%; border-radius:var(--r-inner); border:1px solid var(--line); display:block}

/* chart */
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:#fff; border-radius:var(--r-inner); padding:7px 9px; font-size:12px; line-height:1.4; z-index:5; white-space:nowrap}
.dropz{display:inline-flex; align-items:center; gap:var(--s2); border:1.5px dashed var(--line);
  border-radius:var(--r-card); padding:9px 14px; background:var(--sunk); cursor:pointer;
  font-size:13px; color:var(--ink-muted); font-weight:500}
.dropz:hover{border-color:var(--blue); color:var(--blue-ink); background:var(--blue-bg)}
.dropz.big{padding:26px; justify-content:center; text-align:center; font-size:15px}
#dropveil{position:fixed; inset:0; z-index:60; background:rgba(0,122,255,.10);
  display:grid; place-items:center; pointer-events:none}
#dropveil div{background:var(--card); border:2px dashed var(--blue); border-radius:var(--r-card);
  padding:var(--s6) var(--s7); font-size:18px; font-weight:600; color:var(--blue-ink); text-align:center}
#dropveil small{display:block; font-size:13px; font-weight:400; color:var(--ink-muted); margin-top:var(--s2)}
body[data-text="large"]{font-size:17px}
body[data-text="large"] .cap,
body[data-text="large"] .hint,
body[data-text="large"] .obs .ft,
body[data-text="large"] .badge{font-size:14px}
body[data-text="large"] .btn{font-size:16px; padding:11px 18px}
body[data-text="large"] .inp{font-size:17px; padding:11px 12px}
body[data-text="large"] .tab{font-size:16px; padding:15px 16px 13px}
body[data-text="large"] .obs .nm{font-size:15px}
body[data-text="large"] .obs .vl{font-size:27px}
body[data-text="large"] table{font-size:16px}
body[data-text="large"] h1{font-size:30px}
body[data-text="large"] h2{font-size:22px}
body[data-text="large"] h3{font-size:18px}
footer.fix{position:fixed; left:0; right:0; bottom:0; z-index:35; background:var(--card); border-top:1px solid var(--line); padding:10px var(--s4); padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); font-size:12px; color:var(--ink-muted); text-align:center}
footer.fix b{color:var(--ink)}
@media (max-width:560px){
  h1{font-size:24px} .card{padding:var(--s4)} .drawer{width:100%} .big{font-size:34px}
  .top-in h1{font-size:17px; width:100%; margin-bottom:var(--s1)}
}
@media print{
  body{background:#FFFFFF; font-size:11pt}
  :root{--ink-muted:#222; --ink-body:#222; --bg:#FFFFFF; --line:#BBB; --line-soft:#DDD}
  .card,.tile,.callout{background:#FFFFFF!important; border:1px solid #BBB; break-inside:avoid}
  .badge{background:#FFFFFF!important; color:#222!important; border:1px solid #777}
  .dot,[class*="z"],[class*="bar"]{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  h2,h3{break-after:avoid}
  header.top,nav.tabs,footer.fix,.btn,.scrim,.drawer{display:none!important}
  .wrap{padding-block:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1>Vitals Journal</h1>
    <div class="people" id="people"></div>
    <span class="badge st-in_range" title="No server, no account. Records stay in this browser."><span class="dot"></span>On this device</span>
  </div>
</header>
<div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav><main id="view"></main></div>
<div id="dropveil" hidden><div>Drop the report here<small>A PDF has its values read out of it. A photo is attached to check against.</small></div></div>
<input type="file" id="globalPick" accept="image/*,application/pdf,.txt,.csv,.tsv" multiple hidden>
<footer class="fix"><b>Decision-support only, not a diagnosis.</b> A patient-held copy — give your clinician the original report, not this.</footer>

<script>
"use strict";
/* ===========================================================================
   VITALS JOURNAL v2 — a patient-held record book. No server. No account.
   Records live in this browser only; attachments in this browser's IndexedDB.

   Safety rules carried over from ~/Projects/vitals-app and NOT negotiable:
     1. Nothing is stored until a human has confirmed it against the source.
     2. Reference ranges come from the report. The app ships none of its own
        for lab tests and says "no range on file" rather than guess.
     3. The app never generates a medical recommendation.
   Added at the clinical review, 2026-09-23:
     4. Units travel with the value. A reading is never compared or plotted
        against another unit without an explicit, displayed conversion.
     5. A trend that crosses laboratories is flagged as such.
     6. Under-18 and pregnancy are flagged as "adult ranges do not apply".
   =========================================================================== */

const LS = "vitals-journal-v2", LS_OLD = "vitals-journal-v1";
const uid = () => Math.random().toString(36).slice(2,10);
const today = () => new Date().toISOString().slice(0,10);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* --------------------------------------------------------------- catalog
   u  = canonical unit · alt = [displayUnit, multiply-by-this-to-reach-canonical]
   syn = names seen on Vietnamese and English reports, lowercased, accent-free */
const C = {
 glucose_fasting:{n:"Glucose (fasting)",u:"mmol/L",g:"Metabolic",alt:[["mg/dL",1/18.016]],syn:["glucose","duong huyet","glucose mau","glu","duong mau","blood glucose","fasting glucose"]},
 hba1c_dcct:{n:"HbA1c",u:"%",g:"Metabolic",syn:["hba1c","hb a1c","a1c","hemoglobin a1c","huyet sac to a1c"]},

 ldl_c:{n:"LDL cholesterol",u:"mmol/L",g:"Lipids",alt:[["mg/dL",1/38.67]],syn:["ldl","ldl-c","ldl c","ldl cholesterol","ldl - cholesterol"]},
 hdl_c:{n:"HDL cholesterol",u:"mmol/L",g:"Lipids",alt:[["mg/dL",1/38.67]],syn:["hdl","hdl-c","hdl c","hdl cholesterol","hdl - cholesterol"]},
 non_hdl_c:{n:"Non-HDL cholesterol",u:"mmol/L",g:"Lipids",alt:[["mg/dL",1/38.67]],syn:["non hdl","non-hdl","non hdl-c"]},
 triglycerides:{n:"Triglycerides",u:"mmol/L",g:"Lipids",alt:[["mg/dL",1/88.57]],syn:["triglycerid","triglyceride","triglycerides","tg","trigly"]},
 apob:{n:"Apolipoprotein B",u:"g/L",g:"Lipids",syn:["apob","apo b","apolipoprotein b"]},
 lpa:{n:"Lipoprotein(a)",u:"nmol/L",g:"Lipids",syn:["lp(a)","lpa","lipoprotein a"]},
 alt:{n:"ALT",u:"U/L",g:"Liver",syn:["alt","sgpt","alt (gpt)","gpt","alt/sgpt","alanin aminotransferase"]},
 ast:{n:"AST",u:"U/L",g:"Liver",syn:["ast","sgot","ast (got)","got","ast/sgot","aspartat aminotransferase"]},
 ggt:{n:"GGT",u:"U/L",g:"Liver",syn:["ggt","gamma gt","gamma-gt","g-gt"]},
 alp:{n:"ALP",u:"U/L",g:"Liver",syn:["alp","phosphatase kiem","alkaline phosphatase","photphatase kiem"]},
 bilirubin_total:{n:"Bilirubin, total",u:"µmol/L",g:"Liver",alt:[["mg/dL",17.104]],syn:["bilirubin toan phan","bilirubin total","bilirubin tp","total bilirubin","bilirubin"]},
 direct_bilirubin:{n:"Bilirubin, direct",u:"µmol/L",g:"Liver",alt:[["mg/dL",17.104]],syn:["bilirubin truc tiep","direct bilirubin","bilirubin tt"]},
 indirect_bilirubin:{n:"Bilirubin, indirect",u:"µmol/L",g:"Liver",alt:[["mg/dL",17.104]],syn:["bilirubin gian tiep","indirect bilirubin","bilirubin gt"]},
 albumin:{n:"Albumin",u:"g/L",g:"Liver",alt:[["g/dL",10]],syn:["albumin"]},
 total_protein:{n:"Protein, total",u:"g/L",g:"Liver",alt:[["g/dL",10]],syn:["protein toan phan","total protein","protein tp","protein"]},
 globulin:{n:"Globulin",u:"g/L",g:"Liver",alt:[["g/dL",10]],syn:["globulin"]},
 ag_ratio:{n:"A/G ratio",u:"ratio",g:"Liver",syn:["a/g","ty le a/g","ag ratio"]},
 creatinine:{n:"Creatinine",u:"µmol/L",g:"Kidney",alt:[["mg/dL",88.4]],syn:["creatinin","creatinine","cre","creatinin mau"]},
 egfr:{n:"eGFR",u:"mL/min/1.73m²",g:"Kidney",syn:["egfr","mlct","gfr","do loc cau than","mlct uoc tinh"]},

 bun:{n:"Urea",u:"mmol/L",g:"Kidney",alt:[["mg/dL (BUN)",0.357]],syn:["ure","ure mau","urea","bun","urê"]},
 urine_protein:{n:"Urine protein",u:"g/L",g:"Kidney",syn:["protein nieu","urine protein","pro (nieu)"]},
 sodium:{n:"Sodium",u:"mmol/L",g:"Electrolytes",syn:["natri","sodium","na","na+"]},
 potassium:{n:"Potassium",u:"mmol/L",g:"Electrolytes",syn:["kali","potassium","k","k+"]},

 calcium:{n:"Calcium",u:"mmol/L",g:"Electrolytes",alt:[["mg/dL",0.2495]],syn:["canxi","calcium","ca","ca toan phan","calci"]},
 phosphate:{n:"Phosphate",u:"mmol/L",g:"Electrolytes",syn:["phospho","phosphate","photpho"]},
 magnesium:{n:"Magnesium",u:"mmol/L",g:"Electrolytes",syn:["magie","magnesium","mg"]},

/* A lab reports something this catalogue has never heard of. It is still a
   number on your sheet, so it becomes a metric of its own rather than being
   dropped. The id is derived from the name, so two devices reading the same
   report invent the SAME code and converge instead of duplicating. */
function slug(name){
  return "c-" + deaccent(String(name||"")).toLowerCase()
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
}
function meta(c){
  if(C[c]) return C[c];
  const cu = (typeof S!=="undefined" && S && S.customCodes) ? S.customCodes[c] : null;
  if(cu) return {n:cu.n, u:cu.u||"", g:cu.g||"Also on your reports", custom:true};
  return {n:c, u:"", g:"Also on your reports", custom:true};
}
function isCustom(c){ return !C[c]; }
function unitsFor(code){
  const m = meta(code);
  const list = [[m.u,1]].concat(m.alt||[]);
  return list.filter((x,i)=>x[0]!=="" || i===0);
}
/* value as stored (canonical) -> display in a chosen unit */
function toUnit(v, code, unit){
  const list = unitsFor(code); const hit = list.find(x=>x[0]===unit);
  return hit ? v/hit[1] : v;
}
function toCanonical(v, code, unit){
  const list = unitsFor(code); const hit = list.find(x=>x[0]===unit);
  return hit ? v*hit[1] : v;
}

/* ======================================================= the parser
   Turns pasted report text into candidate rows. It fills the template;
   it never decides anything. Every row it produces lands UNCONFIRMED. */
function deaccent(s){
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[đĐ]/g,"d");
}
const SYN = (()=>{ const m = new Map();
  for(const code in C){
    m.set(deaccent(C[code].n).toLowerCase(), code);
    (C[code].syn||[]).forEach(s=>{ if(!m.has(s)) m.set(s, code); });
  }
  return m;
})();
const UNIT_MAP = {
  "mmol/l":"mmol/L","mg/dl":"mg/dL","umol/l":"µmol/L","µmol/l":"µmol/L","g/l":"g/L","g/dl":"g/dL",
  "u/l":"U/L","iu/l":"U/L","ui/l":"U/L","ng/ml":"ng/mL","pg/ml":"pg/mL","pmol/l":"pmol/L","nmol/l":"nmol/L",
  "miu/l":"mIU/L","uiu/ml":"µIU/mL","µiu/ml":"µIU/mL","miu/ml":"mIU/mL","ug/l":"µg/L","µg/l":"µg/L",
  "mg/l":"mg/L","u/ml":"U/mL","%":"%","fl":"fL","pg":"pg","l/l":"L/L","mm/h":"mm/h","mmhg":"mmHg",
  "bpm":"bpm","lan/phut":"bpm","kg":"kg","cm":"cm","in":"in","lb":"lb","ms":"ms","ratio":"ratio",
  "t/l":"×10¹²/L","g/t":"×10⁹/L","k/ul":"×10⁹/L","10^9/l":"×10⁹/L","x10^9/l":"×10⁹/L",
  "10^12/l":"×10¹²/L","x10^12/l":"×10¹²/L","ng/dl":"ng/dL","mmol/mol":"mmol/mol","mg/dl (bun)":"mg/dL (BUN)"
};
function normUnit(raw){
  if(!raw) return "";
  const k = deaccent(raw).toLowerCase().replace(/\s+/g,"").replace(/µ/g,"u");
  return UNIT_MAP[k] || UNIT_MAP[k.replace(/u/g,"µ")] || raw.trim();
}
function matchCode(nameRaw){
  let n = deaccent(nameRaw).toLowerCase()
    .replace(/[()\[\]:*#]/g," ").replace(/^\s*\d+[.)]\s*/,"").replace(/\s+/g," ").trim();
  if(!n) return null;
  if(SYN.has(n)) return SYN.get(n);
  const noSpace = n.replace(/\s|-/g,"");
  for(const [k,v] of SYN) if(k.replace(/\s|-/g,"")===noSpace) return v;
  let best = null, bestLen = 0;
  for(const [k,v] of SYN){
    if(k.length>=3 && n.indexOf(k)!==-1 && k.length>bestLen){ best = v; bestLen = k.length; }
  }
  return best;
}
/* Match the LONGEST synonym the line begins with. Splitting on the first
   digit fails on "1. Glucose" and on names that contain digits themselves
   ("Vitamin D (25-OH)", "CA 19-9", "Vitamin B12"), so we anchor on the name. */
function matchAtStart(norm){
  let best=null,len=0;
  for(const [k,v] of SYN){
    if(k.length<2 || k.length<=len) continue;
    if(norm.lastIndexOf(k,0)===0){
      const nx=norm.charAt(k.length);
      if(nx==="" || !/[a-z0-9]/.test(nx)){ best=v; len=k.length; }
    }
  }
  return best?{code:best,len:len}:null;
}
function parseReport(text){
  const rows=[], skipped=[];
  for(const rawLine of String(text||"").split(/\r?\n/)){
    const line=rawLine.replace(/\t/g,"  ").trim();
    if(!line || line.length<3) continue;
    let D=deaccent(line);
    if(/^(ten xet nghiem|ten xn|chi tieu xet nghiem|tri so binh thuong|tri so tham chieu|gia tri tham chieu|khoang tham chieu|test name|reference range|result\s+unit|stt\s)/i.test(D)) continue;
    D=D.replace(/^\s*\d{1,3}\s*[.)]\s+/,"");          /* leading row number */
    D=D.replace(/(\d),(\d{1,2})(?!\d)/g,"$1.$2");      /* Vietnamese decimal comma */
    const norm=D.toLowerCase();
    const hit=matchAtStart(norm);
    let code, newName="";
    if(hit){ code=hit.code; }
    else {
      /* no catalogue match: treat "Some Name   12.3  unit  1 - 5" as a metric
         of its own, provided the name reads like a name */
      const fd = D.search(/\d/);
      const nm = fd>0 ? D.slice(0,fd).replace(/[.:|\-\u2013\u2014\s]+$/,"").trim() : "";
      const letters = (nm.match(/[A-Za-z]/g)||[]).length;
      if(!nm || letters<2 || nm.length>48){ if(/\d/.test(D)) skipped.push(D.slice(0,34).trim()); continue; }
      code = slug(nm); newName = nm;
      if(!code || code==="c-"){ skipped.push(D.slice(0,34).trim()); continue; }
    }
    let rest = hit ? D.slice(hit.len) : D.slice(D.search(/\d/));
    rest=rest.replace(/^\s*\([^)]*\)/,"");              /* "(GOT)", "(25-OH)" */
    rest=rest.replace(/^[\s:.|\-\u2013\u2014]+/,"");
    const vm=rest.match(/^-?\d+(?:\.\d+)?/);
    if(!vm){ continue; }
    const value=vm[0];
    let after=rest.slice(value.length);
    /* a unit token, accepted only if it is a real unit for THIS test */
    if(newName && /^\s*[\/\-]\s*\d/.test(after)){ skipped.push(D.slice(0,34).trim()); continue; }
    let unit="";
    const um=after.match(/^\s*([A-Za-z\u00b5%^/0-9.\-]{1,14})/);
    if(um && !/^[<>\u2264\u2265]/.test(um[1]) && !/^-?\d+(\.\d+)?$/.test(um[1])){
      const cand=normUnit(um[1]);
      /* a known test only accepts its own units; a brand new one takes whatever
         its report printed, because there is nothing to check it against */
      if(newName || unitsFor(code).some(x=>x[0]===cand)){ unit=cand; after=after.slice(um[0].length); }
    }
    if(!unit) unit=meta(code).u;
    let lo="",hi="",lab="",m;
    if((m=after.match(/(-?\d+(?:\.\d+)?)\s*[\-\u2013\u2014]\s*(-?\d+(?:\.\d+)?)/))){ lo=m[1]; hi=m[2]; lab=m[1]+"\u2013"+m[2]; }
    else if((m=after.match(/[<\u2264]\s*(-?\d+(?:\.\d+)?)/))){ hi=m[1]; lab="\u2264 "+m[1]; }
    else if((m=after.match(/[>\u2265]\s*(-?\d+(?:\.\d+)?)/))){ lo=m[1]; lab="\u2265 "+m[1]; }
    if(newName){
      const META=/(^|\s)(ngay|date|thoi gian|time|so dien thoai|dien thoai|phone|tel|dia chi|address|ma so|ma benh nhan|patient|benh nhan|bac si|doctor|ho ten|ho va ten|full name|gioi tinh|sex|tuoi|age|stt|barcode|so phieu)(\s|$)/;
      const looksMeta = META.test(deaccent(newName).toLowerCase());
      const looksLikeId = /^\d{7,}$/.test(value);
      const unitHasDigits = /\d/.test(unit);
      if(looksMeta || looksLikeId || unitHasDigits || (!unit && lo==="" && hi==="")){
        skipped.push(D.slice(0,34).trim());
        continue;
      }
    }
    rows.push({code,value,unit,refLow:lo,refHigh:hi,refLabel:lab?lab+" "+unit:"",
      confirmed:false,src:line.slice(0,90),newName:newName});
  }
  return {rows,skipped};
}

/* Books seeded before the ids were made stable carry examples with random ids,
   which is what let 20 become 40. Drop those; keep every real record. */
function isSample(x){ return !!(x && x.sample); }
function repairLegacy(p){
  const legacy = (p.observations||[]).some(o=>isSample(o) && String(o.id).indexOf("smp-")!==0)
              || (p.actions||[]).some(a=>isSample(a) && String(a.id).indexOf("smp-")!==0)
              || (p.members||[]).some(m=>isSample(m) && String(m.id).indexOf("smp-")!==0);
  if(!legacy) return p;
  p.observations = (p.observations||[]).filter(o=>!isSample(o));
  p.actions      = (p.actions||[]).filter(a=>!isSample(a));
  const real = new Set(p.observations.map(o=>o.memberId).concat(p.actions.map(a=>a.memberId)));
  p.members = (p.members||[]).filter(m=>real.has(m.id));
  if(!p.members.length){
    const f = seed();
    p.members=f.members; p.observations=f.observations; p.actions=f.actions;
  }
  return p;
}
function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw){ const p = JSON.parse(raw); if(p && p.members && p.members.length) return repairLegacy(p); }
    const old = localStorage.getItem(LS_OLD);
    if(old){ const p = JSON.parse(old); if(p && p.members && p.members.length) return repairLegacy(migrate(p)); }
  }catch(e){ console.warn("read failed", e); }
  return seed();
}
function migrate(p){
  (p.observations||[]).forEach(o=>{
    if(o.valueRaw===undefined){ o.valueRaw = String(o.value); o.unit = meta(o.code).u; }
    if(o.fasting===undefined) o.fasting = "";
  });
  p.v = 2; return p;
}
let warned=false;
function save(){
  try{ if(typeof queueSync==="function") queueSync(); }catch(e){}
  try{ localStorage.setItem(LS, JSON.stringify(S)); }
  catch(e){ if(!warned){ warned=true; alert("This browser refused to save — private window, or storage is full.\n\nYour records are on screen but will go when the tab closes. Open Settings and copy the backup out now."); } }
}

function hasSamples(){ return (S.observations||[]).some(o=>o.sample) || (S.actions||[]).some(a=>a.sample); }

let _db=null;
function idb(){ if(_db) return _db;
  _db = new Promise((res,rej)=>{ let r; try{ r = indexedDB.open("vitals-journal-files",1);}catch(e){return rej(e);}
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains("f")) r.result.createObjectStore("f"); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  return _db; }
async function putFile(id,blob){ try{ const d=await idb(); await new Promise((res,rej)=>{
    const t=d.transaction("f","readwrite"); t.objectStore("f").put(blob,id); t.oncomplete=res; t.onerror=()=>rej(t.error); });
  return true; }catch(e){ return false; } }
async function delFile(id){
  if(!id) return;
  try{ const d=await idb(); await new Promise((res,rej)=>{
    const t=d.transaction("f","readwrite"); t.objectStore("f").delete(id);
    t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){}
}
async function getFile(id){ try{ const d=await idb(); return await new Promise((res,rej)=>{
    const r=d.transaction("f","readonly").objectStore("f").get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); });
  }catch(e){ return null; } }

/* --------------------------------------------------- computation */
function person(id){ return (S.members||[]).find(m=>m.id===id) || (S.members||[])[0] || {id:"none",name:"\u2014",sex:"",dob:"",population:"asian_pacific"}; }
function ageOf(m){ if(!m||!m.dob) return null; const d=new Date(m.dob); if(isNaN(d)) return null;
  const t=new Date(); let a=t.getFullYear()-d.getFullYear(); const k=t.getMonth()-d.getMonth();
  if(k<0||(k===0&&t.getDate()<d.getDate())) a--; return a>=0&&a<130?a:null; }
function fmt(v,dp){ if(v==null||v===""||!isFinite(v)) return "—"; const n=Number(v);
  if(dp!==undefined) return n.toFixed(dp);
  const a=Math.abs(n); return String(+n.toFixed(a>=100?0:a>=10?1:2)); }
function derivedBMI(mid){
  const hs = S.observations.filter(o=>o.memberId===mid&&o.code==="height_cm")
    .sort((x,y)=>(y.observedAt||"").localeCompare(x.observedAt||""));
  if(!hs.length) return [];
  const h = hs[0].value/100; if(!(h>0.5&&h<2.6)) return [];
  return S.observations.filter(o=>o.memberId===mid&&o.code==="weight_kg").map(w=>{
    const v = +(w.value/(h*h)).toFixed(1);
    return {id:"bmi-"+w.id,memberId:mid,code:"bmi",value:v,valueRaw:String(v),unit:"kg/m²",
      observedAt:w.observedAt,source:w.source,refLow:null,refHigh:null,refLabel:"",fasting:"",
      specimen:"",note:"",manualStatus:null,derived:true,sample:w.sample};
  });
}
function obsOf(mid){ return S.observations.filter(o=>o.memberId===mid).concat(derivedBMI(mid)); }
function statusOf(o){
  if(o.manualStatus) return o.manualStatus;
  if(o.code==="bmi"){ const std = BMI_STD[person(o.memberId).population]||BMI_STD.general, c=std.cuts;
    return o.value<c[0]?"discuss": o.value<c[1]?"in_range": o.value<c[2]?"watch":"discuss"; }
  const lo = o.refLow==null||o.refLow===""?null:Number(o.refLow);
  const hi = o.refHigh==null||o.refHigh===""?null:Number(o.refHigh);
  if(lo===null&&hi===null) return "unknown";
  const v=Number(o.value), inLo=lo===null||v>=lo, inHi=hi===null||v<=hi;
  if(inLo&&inHi) return "in_range";
  const span=(lo!==null&&hi!==null&&hi>lo)?hi-lo:Math.abs(hi!==null?hi:lo)||1;
  return ((!inHi?v-hi:lo-v)/span)<=0.10 ? "watch" : "discuss";
}
function why(o){
  const M=meta(o.code);
  if(o.manualStatus) return "Status set by hand"+(o.note?" — "+o.note:"")+".";
  if(o.code==="bmi"){ const m=person(o.memberId), std=BMI_STD[m.population]||BMI_STD.general, c=std.cuts, v=o.value;
    const b = v<c[0]?std.names[0]:v<c[1]?std.names[1]:v<c[2]?std.names[2]:std.names[3];
    return b+" on "+std.label+". Worked out from height and weight — not measured."; }
  const lo=o.refLow==null||o.refLow===""?null:Number(o.refLow);
  const hi=o.refHigh==null||o.refHigh===""?null:Number(o.refHigh);
  if(lo===null&&hi===null) return "No reference range on file. Type the range printed on this report and the status resolves.";
  const rng = o.refLabel || (lo!==null&&hi!==null?fmt(toUnit(lo,o.code,o.unit))+"–"+fmt(toUnit(hi,o.code,o.unit))+" "+o.unit
    : hi!==null?"≤ "+fmt(toUnit(hi,o.code,o.unit))+" "+o.unit : "≥ "+fmt(toUnit(lo,o.code,o.unit))+" "+o.unit);
  const v=Number(o.value);
  if((lo===null||v>=lo)&&(hi===null||v<=hi)) return "Inside "+rng+", the range printed on this report.";
  const d = hi!==null&&v>hi ? toUnit(v-hi,o.code,o.unit) : toUnit(lo-v,o.code,o.unit);
  return fmt(d)+" "+o.unit+(hi!==null&&v>hi?" above":" below")+" the limit printed on this report ("+rng+").";
}
function latest(mid){ const m=new Map();
  for(const o of obsOf(mid)){ const p=m.get(o.code); if(!p||(o.observedAt||"")>(p.observedAt||"")) m.set(o.code,o); }
  return [...m.values()]; }
function series(mid,code){ return obsOf(mid).filter(o=>o.code===code&&isFinite(o.value))
  .sort((a,b)=>(a.observedAt||"").localeCompare(b.observedAt||"")); }

/* ------------------------------------- safety checks (the clinical pass) */
function checksFor(mid){
  const out=[], m=person(mid), age=ageOf(m);
  if(age!==null && age<18) out.push({t:"amber",k:"Adult ranges do not apply",
    x:"This person is "+age+". Paediatric reference intervals differ by age and often by Tanner stage — a range typed off an adult report will read wrong here. Use the range printed on their own paediatric report and nothing else."});
  const byCode={}; obsOf(mid).forEach(o=>{ (byCode[o.code]=byCode[o.code]||[]).push(o); });
  const mixed=[], crossLab=[], dupDay=[];
  for(const code in byCode){
    const rows=byCode[code]; if(rows.length<2) continue;
    const units=[...new Set(rows.map(r=>r.unit))];
    if(units.length>1) mixed.push(meta(code).n+" ("+units.join(" / ")+")");
    const labs=[...new Set(rows.map(r=>(r.source||"").trim()).filter(Boolean))];
    if(labs.length>1) crossLab.push(meta(code).n);
    const days={}; rows.forEach(r=>{ (days[r.observedAt]=days[r.observedAt]||[]).push(r); });
    for(const d in days) if(days[d].length>1 && [...new Set(days[d].map(r=>r.source))].length>1) dupDay.push(meta(code).n+" on "+d);
  }
  if(mixed.length) out.push({t:"blue",k:"Units converted for comparison",
    x:"These are on file in more than one unit: "+mixed.join(", ")+". Each reading is shown in the unit its own report used, and converted to a single unit before anything is compared or plotted. Check the conversion looks right before you read anything into the trend."});
  if(crossLab.length) out.push({t:"amber",k:"Trends cross laboratories",
    x:crossLab.slice(0,6).join(", ")+(crossLab.length>6?" and "+(crossLab.length-6)+" more":"")+" have readings from more than one lab. Different labs use different analysers and methods, so a step in the line can be the lab rather than the person. Treat a cross-lab change as a question, not a finding."});
  if(dupDay.length) out.push({t:"blue",k:"Same test, same day, two labs",
    x:dupDay.slice(0,4).join("; ")+". Both are kept and neither is averaged — the disagreement is the information."});
  return out;
}

/* ------------------------------------------------------- components */
function badge(st){ return '<span class="badge st-'+st+'"><span class="dot"></span>'+esc(ST[st]||st)+'</span>'; }
function bandHTML(o, cuts, names){
  const M=meta(o.code);
  let marks=[];
  if(cuts) marks=cuts.slice();
  else { if(o.refLow!=null&&o.refLow!=="") marks.push(toUnit(Number(o.refLow),o.code,o.unit));
         if(o.refHigh!=null&&o.refHigh!=="") marks.push(toUnit(Number(o.refHigh),o.code,o.unit)); }
  if(!marks.length) return "";
  const shown = toUnit(Number(o.value),o.code,o.unit);
  const pts=marks.concat([shown]);
  let mn=Math.min.apply(null,pts), mx=Math.max.apply(null,pts);
  const pad=(mx-mn)*0.35||Math.abs(mx||1)*0.2||1; mn-=pad; mx+=pad;
  const X=v=>Math.max(0,Math.min(100,((v-mn)/(mx-mn))*100));
  let zones="";
  const edges=[mn].concat(marks,[mx]);
  const cls = cuts ? ["zlo","zok","zhi","zhi"] : (marks.length===2?["zlo","zok","zhi"]:(o.refHigh!=null&&o.refHigh!==""?["zok","zhi"]:["zlo","zok"]));
  for(let i=0;i<edges.length-1;i++){ const a=X(edges[i]), b=X(edges[i+1]);
    zones+='<i class="'+(cls[i]||"zhi")+'" style="left:'+a+'%;width:'+(b-a)+'%"></i>'; }
  let ticks="";
  marks.forEach((v,i)=>{ const nm = names&&names[i+1]?names[i+1]:"";
    ticks+='<span style="left:'+Math.max(6,Math.min(94,X(v)))+'%">'+fmt(v)+(nm?"<br>"+esc(nm):"")+'</span>'; });
  return '<div class="band"><div class="ed"><span>'+fmt(mn)+'</span><span>'+esc(o.unit||M.u)+'</span><span>'+fmt(mx)+'</span></div>'+
    '<div class="tr">'+zones+'<span class="mk" style="left:'+X(shown)+'%"></span></div>'+
    '<div class="tk" style="height:'+(names?30:16)+'px">'+ticks+'</div></div>';
}
function obsCard(o){
  const M=meta(o.code), st=statusOf(o);
  const alt = o.unit!==M.u ? fmt(o.value)+" "+M.u : "";
  return '<button class="obs" data-obs="'+esc(o.id)+'">'+
    '<div class="nm">'+icon(o.code)+' '+esc(M.n)+(o.derived?' · derived':'')+'</div>'+
    '<div class="vl">'+esc(o.valueRaw||fmt(o.value))+'<span>'+esc(o.unit||M.u)+'</span></div>'+
    (alt?'<div class="cap num">= '+esc(alt)+'</div>':'')+
    '<div style="margin-top:var(--s2)">'+badge(st)+'</div>'+
    '<div class="ft">'+esc(o.source||"source not recorded")+' · '+esc(o.observedAt||"no date")+
      (o.fasting?' · '+esc(o.fasting):'')+'</div></button>';
}

function ghostCard(code){
  const M = meta(code);
  return '<button class="obs ghost" data-addcode="'+esc(code)+'">'+
    '<div class="nm">'+icon(code)+' '+esc(M.n)+'</div>'+

    '<div style="margin-top:var(--s2)"><span class="badge st-unknown"><span class="dot"></span>Not yet measured</span></div>'+
    '</button>';
}
function pairCard(ca, cb, label, L){
  const a = L.find(o=>o.code===ca), b = L.find(o=>o.code===cb);
  if(!a && !b){
    return '<button class="obs ghost" data-addcode="'+esc(ca)+'">'+
      '<div class="nm">'+icon(ca)+' '+esc(label)+'</div>'+
      '<div class="vl" style="color:var(--line)">&mdash;</div>'+
      '<div style="margin-top:var(--s2)"><span class="badge st-unknown"><span class="dot"></span>Not yet measured</span></div></button>';
  }
  const sep = (PAIRS[ca]&&PAIRS[ca].sep) || " / ";
  /* judge only what was actually measured: a missing half is a gap, not a
     verdict, and "no range on file" beside a value that has one reads wrong */
  const present = [];
  if(a) present.push(statusOf(a));
  if(b) present.push(statusOf(b));
  present.sort((x,y)=>RANK[x]-RANK[y]);
  const worst = present[0] || "unknown";
  const half = (a?0:1) + (b?0:1);
  const shown = (a?esc(a.valueRaw||fmt(a.value)):"\u2014") + sep + (b?esc(b.valueRaw||fmt(b.value)):"\u2014");
  const src = (a||b);
  return '<button class="obs" data-obs="'+esc((a||b).id)+'">'+
    '<div class="nm">'+icon(ca)+' '+esc(label)+'</div>'+
    '<div class="vl">'+shown+'<span>'+esc((a||b).unit||meta(ca).u)+'</span></div>'+
    '<div style="margin-top:var(--s2)">'+badge(worst)+
      (half?' <span class="badge st-unknown"><span class="dot"></span>'+esc(a?meta(cb).n:meta(ca).n)+' not measured</span>':'')+'</div>'+
    '<div class="ft">'+esc(src.source||"source not recorded")+' · '+esc(src.observedAt||"no date")+'</div></button>';
}
function vRecord(){
  const m=person(who), L=latest(m.id);
  let h = hasSamples()?sampleNote():"";
  h += '<div class="row" style="justify-content:space-between;margin-bottom:var(--s3)">'+
    '<h2>'+esc(m.name)+'</h2>'+
    '<button class="btn pri" data-tab="add" style="font-size:16px;padding:12px 20px">Add a report</button></div>';
  const chk=checksFor(m.id);
  if(chk.length) h += chk.map(c=>'<div class="callout c-'+c.t+'" style="margin-bottom:var(--s3)"><div class="kick">'+esc(c.k)+'</div><p>'+esc(c.x)+'</p></div>').join("");

  const panel = (S.panel||[]).slice();
  const have = new Set(L.map(o=>o.code));
  const onFile = panel.filter(c=>have.has(c)).length;

  h += '<div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:var(--s2)">'+
    '<h3>Latest values &amp; flags</h3>'+
    '<span class="cap"><span class="num">'+onFile+'</span> of <span class="num">'+panel.length+'</span> measured</span></div>'+
    '<div class="cap" style="margin-bottom:var(--s3)">Newest reading for each metric, against the range printed on its own report.</div>'+
    '<div class="row" style="margin-bottom:var(--s4)">'+
      badge("in_range")+badge("watch")+badge("discuss")+badge("unknown")+'</div>';

  const consumed = new Set();
  const cards = [];
  for(const code of panel){
    if(consumed.has(code)) continue;
    const pair = PAIRS[code];
    if(pair && panel.indexOf(pair.mate)>=0){
      consumed.add(code); consumed.add(pair.mate);
      cards.push(pairCard(code, pair.mate, pair.label, L));
      continue;
    }
    const o = L.find(x=>x.code===code);
    cards.push(o ? obsCard(o) : ghostCard(code));
  }
  h += '<div class="grid g240">'+cards.join("")+'</div>';

  const extra = L.filter(o=>panel.indexOf(o.code)<0);
  if(extra.length){
    h += '<div class="sec" style="margin-top:var(--s6)"><h2>Also on your reports</h2>'+
      '<div class="cap" style="margin-bottom:var(--s3)">Recorded, but not on your standard panel. Add any of them to the panel in Settings so a missing one shows up as a gap.</div>'+
      '<div class="grid g240">'+extra.sort((a,b)=>RANK[statusOf(a)]-RANK[statusOf(b)]).map(obsCard).join("")+'</div></div>';
  }
  if(!panel.length && !L.length)
    h += '<div class="empty"><b>Nothing to show yet</b>Your panel is empty and no readings are on file. Restore the default panel in Settings, or add a report.</div>';
  return h;
}

/* The panel is a checklist of what to look for on a report. Showing the gaps
   is the whole point of having one -- a test you have never had done is
   invisible otherwise. */
function panelGaps(L){
  const have = new Set((L||[]).map(o=>o.code));
  const gaps = (S.panel||[]).filter(c=>!have.has(c));
  const on = (S.panel||[]).length - gaps.length;
  let h = '<div class="sec"><div class="row" style="justify-content:space-between;align-items:baseline">'+
    '<h2>Your standard panel</h2>'+
    '<span class="cap"><span class="num">'+on+'</span> of <span class="num">'+(S.panel||[]).length+'</span> on file</span></div>';
  if(!gaps.length){
    h += '<div class="callout c-green"><div class="kick">Complete</div><p>Every test on your panel has at least one reading on file.</p></div>';
  } else {
    const G={};
    gaps.forEach(c=>{ const g=meta(c).g; (G[g]=G[g]||[]).push(c); });
    const order=GROUPS.filter(g=>G[g]).concat(Object.keys(G).filter(g=>GROUPS.indexOf(g)<0));
    h += '<div class="card"><div class="hint" style="margin-bottom:var(--s3)">'+
      'Nothing on file for these yet. It is a checklist for reading your own reports, not advice about which tests you need &mdash; that is a conversation with a doctor. Edit the list in Settings.</div>';
    for(const g of order){
      h += '<div class="kick" style="color:var(--ink-muted);margin-top:var(--s3)">'+esc(g)+'</div><div class="row" style="margin-top:var(--s2)">'+
        G[g].map(c=>'<span class="badge st-unknown"><span class="dot"></span>'+esc(meta(c).n)+'</span>').join("")+'</div>';
    }
    h += '</div>';
  }
  return h+'</div>';
}
function vTrends(){
  const m=person(who);
  const codes=[...new Set(obsOf(m.id).map(o=>o.code))].filter(c=>series(m.id,c).length>1)
    .sort((a,b)=>meta(a).n.localeCompare(meta(b).n));
  if(!codes.length) return '<div class="empty"><b>Nothing to plot yet</b>A trend needs the same test at least twice.</div>';
  if(!trendCode||codes.indexOf(trendCode)<0) trendCode=codes[0];
  const pts=series(m.id,trendCode), M=meta(trendCode);
  const units=[...new Set(pts.map(p=>p.unit))];
  const labs=[...new Set(pts.map(p=>(p.source||"").trim()).filter(Boolean))];
  let h='<div class="row" style="justify-content:space-between;margin-bottom:var(--s4)"><h2>'+esc(m.name)+' over time</h2>'+
    '<select class="inp" id="trendSel" style="width:auto;min-width:220px">'+
    codes.map(c=>'<option value="'+esc(c)+'"'+(c===trendCode?" selected":"")+'>'+esc(meta(c).n)+' ('+series(m.id,c).length+')</option>').join("")+'</select></div>';
  if(units.length>1) h+='<div class="callout c-blue" style="margin-bottom:var(--s3)"><div class="kick">Converted to '+esc(M.u)+'</div>'+
    '<p>These readings were reported in '+esc(units.join(" and "))+'. The line is plotted in '+esc(M.u)+' so the points are comparable; the table below shows each reading in the unit its own report used.</p></div>';
  if(labs.length>1) h+='<div class="callout c-amber" style="margin-bottom:var(--s3)"><div class="kick">'+labs.length+' different laboratories</div>'+
    '<p>'+esc(labs.join(" · "))+'. A step between labs can be the analyser rather than the person. The dots are coloured by each reading&rsquo;s status against its own report&rsquo;s range, not against a common one.</p></div>';
  h+='<div class="card chart" style="position:relative">'+line(pts,M)+'</div>';
  h+='<div class="sec" style="margin-top:var(--s4)"><h2>The readings behind the line</h2><div class="card"><div class="tw">'+
    '<table><thead><tr><th>Date</th><th class="n">As reported</th><th class="n">In '+esc(M.u)+'</th><th>Status</th><th>Range on that report</th><th>Lab</th></tr></thead><tbody>'+
    pts.slice().reverse().map(o=>'<tr><td class="n">'+esc(o.observedAt||"—")+'</td>'+
      '<td class="n">'+esc(o.valueRaw||fmt(o.value))+' '+esc(o.unit)+'</td>'+
      '<td class="n">'+fmt(o.value)+'</td><td>'+badge(statusOf(o))+'</td>'+
      '<td class="cap">'+esc(o.refLabel||"none on file")+'</td><td class="cap">'+esc(o.source||"—")+'</td></tr>').join("")+
    '</tbody></table></div></div></div>';
  return h;
}
function stColor(st){ return {in_range:"#34C759",watch:"#FF9500",discuss:"#FF3B30",act:"#FF3B30",unknown:"#8E8E93"}[st]||"#8E8E93"; }
function line(pts,M){
  const W=760,H=270,L=56,R=18,T=20,B=44;
  const ys=pts.map(p=>p.value);
  let mn=Math.min.apply(null,ys), mx=Math.max.apply(null,ys);
  pts.forEach(p=>{ if(p.refLow!=null&&p.refLow!=="") mn=Math.min(mn,Number(p.refLow));
                   if(p.refHigh!=null&&p.refHigh!=="") mx=Math.max(mx,Number(p.refHigh)); });
  const pad=(mx-mn)*0.18||Math.abs(mx||1)*0.15||1; mn-=pad; mx+=pad;
  const span=mx-mn, dp=span<1?2:span<10?1:0;
  const X=i=>L+(pts.length===1?(W-L-R)/2:(i/(pts.length-1))*(W-L-R));
  const Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const last=pts[pts.length-1];
  let ref="";
  if(last.refLow!=null&&last.refLow!==""||last.refHigh!=null&&last.refHigh!==""){
    const yt=Y(last.refHigh!=null&&last.refHigh!==""?Number(last.refHigh):mx);
    const yb=Y(last.refLow!=null&&last.refLow!==""?Number(last.refLow):mn);
    ref='<rect x="'+L+'" y="'+yt.toFixed(1)+'" width="'+(W-L-R)+'" height="'+Math.max(1,yb-yt).toFixed(1)+'" fill="#E6F7EB"></rect>'+
      '<text x="'+(W-R)+'" y="'+(yt-6).toFixed(1)+'" text-anchor="end" font-size="11" fill="#8E8E93">range on the latest report</text>';
  }
  let grid="",ax="";
  for(let i=0;i<=4;i++){ const v=mn+(i/4)*(mx-mn), y=Y(v);
    grid+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="#EFEFF2" stroke-width="1"></line>';
    ax+='<text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="#8E8E93">'+fmt(v,dp)+'</text>'; }
  const d=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.value).toFixed(1)).join(" ");
  let dots="",xl="";
  pts.forEach((p,i)=>{ dots+='<circle class="pt" data-i="'+i+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.value).toFixed(1)+
      '" r="5.5" fill="'+stColor(statusOf(p))+'" stroke="#FFFFFF" stroke-width="2" tabindex="0"></circle>';
    if(i===0||i===pts.length-1||pts.length<=5)
      xl+='<text x="'+X(i).toFixed(1)+'" y="'+(H-B+22)+'" text-anchor="middle" font-size="11" fill="#8E8E93">'+esc(p.observedAt||"")+'</text>'; });
  return '<div class="cap" style="margin-bottom:var(--s2)">'+esc(M.n)+' · '+esc(M.u)+'</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(M.n)+' over time">'+ref+grid+
    '<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="#E5E5EA"></line>'+
    '<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="#E5E5EA"></line>'+ax+
    '<path d="'+d+'" fill="none" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>'+
    dots+'<text x="'+X(pts.length-1).toFixed(1)+'" y="'+(Y(last.value)-13).toFixed(1)+'" text-anchor="end" font-size="13" font-weight="600" fill="#1C1C1E">'+fmt(last.value,dp)+'</text>'+
    xl+'</svg><div class="tip" id="tip" hidden></div>';
}

/* ------------------------------------------------------- add report */
function newDraft(){ return {memberId:who,date:today(),source:"",fasting:"",specimen:"",note:"",
  rows:[],files:[],busy:"",notes:[],skipped:[]}; }
function kb(n){ return n>=1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(n/1024))+" KB"; }
function codeOpts(sel){
  const G={};
  for(const c in C){ (G[C[c].g]=G[C[c].g]||[]).push(c); }
  for(const c in (S.customCodes||{})){ (G["Also on your reports"]=G["Also on your reports"]||[]).push(c); }
  return GROUPS.filter(g=>G[g]).map(g=>'<optgroup label="'+esc(g)+'">'+
    G[g].sort((a,b)=>meta(a).n.localeCompare(meta(b).n))
      .map(c=>'<option value="'+esc(c)+'"'+(c===sel?" selected":"")+'>'+esc(meta(c).n)+'</option>').join("")+'</optgroup>').join("");
}

/* ===================================================== the review step
   What the spec asks for, and all it asks for: reconcile the row count, put
   the disagreements in front of a person as a crop of the line they came
   from, and accept the rest. A value both reads agree on is not improved by
   being ticked. */
function reviewBlock(){
  const rows = draft.rows;
  if(!rows.length) return "";
  const doubt = rows.filter(r => !r.agreed || r.rangeDoubt);
  const ok    = rows.filter(r => r.agreed && !r.rangeDoubt);
  const keptN = rows.filter(r => r.confirmed).length;
  const seen  = draft.files.reduce((a,f) => a + (f.seen||0), 0);
  const step  = draft.files.length ? "3" : "2";

  let h = '<div class="card"><div class="row" style="justify-content:space-between">'+
    '<h3>'+step+' &middot; What was read</h3>'+
    '<span class="badge '+(doubt.length?"st-watch":"st-in_range")+'"><span class="dot"></span>'+
      keptN+' ready to save'+(doubt.length?', '+doubt.length+' to check':'')+'</span></div>';

  /* row-count reconciliation — a dropped row is otherwise invisible */
  if(seen && seen > rows.length + 2){
    h += '<div class="callout c-amber" style="margin-top:var(--s3)"><div class="kick">Some lines were not read</div>'+
      '<p>The pages look like they hold about <b>'+seen+'</b> result lines and <b>'+rows.length+'</b> were read. '+
      'The rest were probably headings or notes, but if something you wanted is missing, add it under '+
      '<b>Or add one test at a time</b> above.</p></div>';
  }

  if(doubt.length){
    h += '<div class="callout c-amber" style="margin-top:var(--s3)"><div class="kick">'+
      doubt.length+' value'+(doubt.length===1?'':'s')+' that need a name</div>'+
      '<p>The extractor read these but could not match them to a test it knows, so nothing was assumed. '+
      'Name each one and it is recorded, or remove it if it is not a result.</p></div>';
    h += doubt.map(r => doubtRow(r, rows.indexOf(r))).join("");
  } else {
    h += '<div class="callout c-green" style="margin-top:var(--s3)"><div class="kick">All matched</div>'+
      '<p>Every one of the '+rows.length+' value'+(rows.length===1?'':'s')+' was matched to a test by name through your alias table. Nothing needs your attention.</p></div>';
  }

  if(ok.length){
    h += '<details><summary>'+ok.length+' value'+(ok.length===1?'':'s')+' accepted &mdash; look if you want to</summary><div>'+
      '<div class="tw"><table><thead><tr><th>Test</th><th class="n">Value</th><th>Range on the report</th><th>From</th></tr></thead><tbody>'+
      ok.map(r => {
        const M = meta(r.code);
        return '<tr><td>'+esc(r.newName || M.n)+'</td>'+
          '<td class="n">'+esc(r.value)+' '+esc(r.unit||"")+'</td>'+
          '<td class="cap">'+esc(r.refLabel || "none printed")+'</td>'+
          '<td class="cap">'+esc(r.from||"")+'</td></tr>';
      }).join("")+'</tbody></table></div>'+
      '<div class="hint" style="margin-top:var(--s3)">Anything here can still be corrected after saving: open the value and press <b>Correct the value</b>.</div>'+
      '</div></details>';
  }
  h += '</div>';

  h += '<div class="row" style="margin-top:var(--s4)">'+
    '<button class="btn pri big" id="saveDraft"'+(keptN?"":" disabled")+' style="max-width:360px">'+
      (keptN ? 'Save '+keptN+' value'+(keptN===1?'':'s')+' to the record' : 'Nothing to save yet')+'</button>'+
    '<button class="btn" id="killDraft">Discard</button></div>';
  return h;
}

function doubtRow(r, i){
  const M = meta(r.code), label = r.newName || M.n;
  return '<div class="card" style="margin-top:var(--s3);border-color:var(--amber-line)">'+
    '<div style="display:grid;grid-template-columns:'+(r.crop?'minmax(0,1fr) 300px':'1fr')+';gap:var(--s4)">'+
    '<div>'+
      '<div class="row" style="justify-content:space-between"><b>'+esc(label)+'</b>'+
      '<button class="btn sm warn" data-rm="'+i+'">Not a result</button></div>'+
      '<div class="cap" style="margin-top:2px">'+esc(r.why || "not matched to a known test")+'</div>'+
      '<div class="cg" style="margin-top:var(--s3)">'+
        '<div><label class="fl" for="v'+i+'">Value</label><input class="inp num" id="v'+i+'" data-f="value" data-i="'+i+'" value="'+esc(r.value)+'" inputmode="decimal"></div>'+
        '<div><label class="fl" for="u'+i+'">Unit</label><input class="inp" id="u'+i+'" data-f="unit" data-i="'+i+'" value="'+esc(r.unit)+'"></div>'+
        '<div><label class="fl" for="lo'+i+'">Range low</label><input class="inp num" id="lo'+i+'" data-f="refLow" data-i="'+i+'" value="'+esc(r.refLow)+'" inputmode="decimal" placeholder="from sheet"></div>'+
        '<div><label class="fl" for="hi'+i+'">Range high</label><input class="inp num" id="hi'+i+'" data-f="refHigh" data-i="'+i+'" value="'+esc(r.refHigh)+'" inputmode="decimal" placeholder="from sheet"></div>'+
      '</div>'+
      '<div class="row" style="margin-top:var(--s3)">'+
        '<button class="btn '+(r.confirmed?'':'pri')+'" data-keep="'+i+'">'+(r.confirmed?'Will be saved':'Looks right, keep it')+'</button>'+
        (r.alt!==null && r.alt!==undefined && String(r.alt)!==String(r.value)
          ? '<button class="btn" data-usealt="'+i+'">The other read says '+esc(r.alt)+'</button>' : '')+
      '</div>'+
    '</div>'+
    (r.crop?'<div><div class="kick" style="color:var(--ink-muted);margin-bottom:var(--s2)">On the page</div>'+
      '<img src="'+r.crop+'" alt="the line this came from" style="width:100%;border:1px solid var(--line);border-radius:var(--r-inner);background:var(--card)"></div>':'')+
    '</div></div>';
}

function vActions(){
  const m=person(who), L=latest(m.id), mine=S.actions.filter(a=>a.memberId===m.id);
  const sev=a=>Math.min.apply(null,(a.codes||[]).map(c=>{const o=L.find(x=>x.code===c);return o?RANK[statusOf(o)]:9;}).concat([9]));
  const open=mine.filter(a=>!a.done).sort((x,y)=>sev(x)-sev(y)||(y.codes||[]).length-(x.codes||[]).length);
  const done=mine.filter(a=>a.done);
  let h='<h2 style="margin-bottom:var(--s3)">Questions for the doctor</h2>';
  h+='<div class="callout c-blue" style="margin-bottom:var(--s4)"><div class="kick">You write these, not the app</div>'+
    '<p>Vitals had a &ldquo;suggest next step&rdquo; feature and it was deliberately cut — it was the one thing that turned a record into a recommendation. '+
    'The list and its ordering survive; the medical judgement stays with you and your doctor. Ordered by the worst status among the tests each item touches.</p></div>';
  h+='<div class="card"><div class="row">'+
    '<input class="inp" id="aT" placeholder="e.g. Ask about the uric acid at the next visit" style="flex:1;min-width:200px">'+
    '<select class="inp" id="aB" style="width:auto">'+Object.keys(BUCKET).map(b=>'<option value="'+b+'">'+esc(BUCKET[b])+'</option>').join("")+'</select>'+
    '<button class="btn pri" id="aAdd">Add</button></div>'+
    '<label class="fl" for="aC" style="margin-top:var(--s3)">Tests it touches (optional)</label>'+

      .map(o=>'<option value="'+esc(o.code)+'">'+esc(meta(o.code).n)+' — '+esc(ST[statusOf(o)])+'</option>').join("")+'</select></div>';
  if(!mine.length) return h+'<div class="empty" style="margin-top:var(--s4)"><b>Nothing written down</b>Add the questions you want to take to the next appointment.</div>';

function exportPayload(memberId){

  const ids = mem.map(m=>m.id);
  return {kind:"vitals-journal", v:2, exported:today(),

function mergeIn(p, label){
  if(!p || p.kind!=="vitals-journal" || !Array.isArray(p.members)) throw new Error("not a Vitals Journal file");
  let addedM=0, addedO=0, addedA=0, dupO=0;
  const haveM=new Set(S.members.map(m=>m.id));
  p.members.forEach(m=>{ if(!haveM.has(m.id)){ S.members.push(m); haveM.add(m.id); addedM++; } });
  const haveO=new Set(S.observations.map(o=>o.id));
  (p.observations||[]).forEach(o=>{ if(haveO.has(o.id)){ dupO++; return; }
    o.origin = label || ("imported "+today()); o.sample=false; S.observations.push(o); haveO.add(o.id); addedO++; });
  const haveA=new Set(S.actions.map(a=>a.id));
  (p.actions||[]).forEach(a=>{ if(!haveA.has(a.id)){ a.sample=false; S.actions.push(a); haveA.add(a.id); addedA++; } });
  return {addedM, addedO, addedA, dupO};
}
