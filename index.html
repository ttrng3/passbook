function loadAuth(){ try{ const r=localStorage.getItem(AUTH_KEY); if(r) AUTH=JSON.parse(r); }catch(e){} }
function saveAuth(){ try{ AUTH?localStorage.setItem(AUTH_KEY,JSON.stringify(AUTH)):localStorage.removeItem(AUTH_KEY); }catch(e){} }
function syncConfigured(){ return SUPA.url.indexOf("http")===0 && SUPA.key.length>10; }

async function supa(path, opts){
  opts = opts || {};
  const h = Object.assign({"apikey":SUPA.key,"Content-Type":"application/json"}, opts.headers||{});
  if(AUTH && AUTH.tok && !opts.noAuth) h["Authorization"] = "Bearer " + AUTH.tok;
  const r = await fetch(SUPA.url+path, {method:opts.method||"GET", headers:h,
    body:opts.body?JSON.stringify(opts.body):undefined});
  let body=null; try{ body = await r.json(); }catch(e){}
  return {ok:r.ok, status:r.status, body};
}
async function renewSession(){
  if(!AUTH || !AUTH.ref) return false;
  const r = await supa("/auth/v1/token?grant_type=refresh_token",
    {method:"POST", noAuth:true, body:{refresh_token:AUTH.ref}});
  if(r.ok && r.body && r.body.access_token){
    AUTH = {tok:r.body.access_token, ref:r.body.refresh_token,
            uid:(r.body.user&&r.body.user.id)||AUTH.uid, email:AUTH.email};
    saveAuth(); return true;
  }
  return false;
}
function returnTo(){ return location.origin + location.pathname; }
async function signInPassword(email, password){
  const r = await supa("/auth/v1/token?grant_type=password",
    {method:"POST", noAuth:true, body:{email, password}});
  if(!r.ok || !r.body || !r.body.access_token){
    const msg = (r.body&&(r.body.msg||r.body.error_description||r.body.message))||"";
    if(/invalid login credentials/i.test(msg))
      throw new Error("That email and password did not match. If you have never set a password, use the sign-in link below and set one afterwards.");
    throw new Error(msg||("Sign-in failed (HTTP "+r.status+")."));
  }
  AUTH = {tok:r.body.access_token, ref:r.body.refresh_token,
          uid:r.body.user&&r.body.user.id, email:email};
  saveAuth(); return true;
}
async function setPassword(password){
  const r = await supa("/auth/v1/user", {method:"PUT", body:{password}});
  if(!r.ok) throw new Error((r.body&&(r.body.msg||r.body.error_description||r.body.message))
    ||("Could not set the password (HTTP "+r.status+")."));
  return true;
}
async function sendCode(email){
  const r = await supa("/auth/v1/otp?redirect_to="+encodeURIComponent(returnTo()),
    {method:"POST", noAuth:true, body:{email, create_user:true}});
  if(!r.ok) throw new Error((r.body&&(r.body.msg||r.body.error_description||r.body.message))
    || ("Could not send the code (HTTP "+r.status+")."));
  return true;
}
async function verifyCode(email, code){
  const r = await supa("/auth/v1/verify", {method:"POST", noAuth:true,
    body:{email, token:code, type:"email"}});
  if(!r.ok || !r.body || !r.body.access_token)
    throw new Error((r.body&&(r.body.msg||r.body.error_description))||"That code was not accepted.");
  AUTH = {tok:r.body.access_token, ref:r.body.refresh_token,
          uid:r.body.user&&r.body.user.id, email:email};
  saveAuth(); return true;
}

/* Merge two documents. Records are identified by id; on an edit the newer
   mtime wins; anything in either side's tombstone list stays deleted. */
function uniq(a){ return [...new Set(a||[])]; }
function pickById(A, B, tombs){
  const m = new Map(), dead = new Set(tombs||[]);
  for(const x of (A||[]).concat(B||[])){
    if(!x || !x.id || dead.has(x.id)) continue;
    const prev = m.get(x.id);
    if(!prev || (x.mtime||0) > (prev.mtime||0)) m.set(x.id, x);
  }
  return [...m.values()];
}
function syncMerge(a, b){
  a=a||{}; b=b||{};
  const ta=a.tomb||{}, tb=b.tomb||{};
  const tomb = {o:uniq((ta.o||[]).concat(tb.o||[])),
                a:uniq((ta.a||[]).concat(tb.a||[])),
                m:uniq((ta.m||[]).concat(tb.m||[])),
                p:uniq((ta.p||[]).concat(tb.p||[]))};
  return {v:2,
    members:      pickById(a.members,      b.members,      tomb.m),
    observations: pickById(a.observations, b.observations, tomb.o),
    actions:      pickById(a.actions,      b.actions,      tomb.a),
    reports:      pickById(a.reports,      b.reports,      []),
    customCodes:  Object.assign({}, b.customCodes||{}, a.customCodes||{}),
    panel:        uniq((a.panel||[]).concat(b.panel||[])).filter(c=>tomb.p.indexOf(c)<0),
    tomb:tomb};
}
function tombstone(kind, id){
  S.tomb = S.tomb || {o:[],a:[],m:[]};
  if(S.tomb[kind].indexOf(id)<0) S.tomb[kind].push(id);
}
function touch(rec){ if(rec) rec.mtime = Date.now(); return rec; }

/* A sign-in link lands back here as #access_token=...&refresh_token=...
   Take them, clear them out of the address bar, and find out who they belong to. */
async function consumeSignInLink(){
  const h = location.hash || "";
  if(h.indexOf("access_token=")<0 && h.indexOf("error=")<0) return false;
  const q = new URLSearchParams(h.replace(/^#/,""));
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  if(q.get("error") || q.get("error_code")){
    syncMsg = {t:"red", k:"That sign-in link did not work",
      x:(decodeURIComponent(q.get("error_description")||q.get("error")||"").replace(/\+/g," "))+
        ". A link can be used once and expires quickly \u2014 ask for a fresh one."};
    return true;
  }
  const tok=q.get("access_token"), ref=q.get("refresh_token");
  if(!tok) return false;
  AUTH = {tok:tok, ref:ref, uid:null, email:null};
  const me = await supa("/auth/v1/user");
  if(me.ok && me.body && me.body.id){
    AUTH.uid = me.body.id; AUTH.email = me.body.email || null; saveAuth();
    const cleared = dropExamples();
    syncMsg = {t:"green", k:"Signed in",
      x:"This device now shows whatever "+(AUTH.email||"this account")+" holds."+
        (cleared?" The example records were cleared \u2014 you have an account now, so the account is the record.":"")};
    return true;
  }
  AUTH = null; saveAuth();
  syncMsg = {t:"red", k:"Signed in, but the account could not be read", x:"Ask for a fresh link and try once more."};
  return true;
}

function realRecordsFor(id){
  return (S.observations||[]).some(o=>o.memberId===id && !isSample(o))
      || (S.actions||[]).some(a=>a.memberId===id && !isSample(a));
}
function dedupePeople(){
  const key = m => [(m.name||"").trim().toLowerCase(), m.dob||"", m.sex||""].join("|");
  const keep = new Map(), remap = {};
  for(const m of (S.members||[])){
    const k = key(m), prev = keep.get(k);
    if(!prev){ keep.set(k,m); continue; }
    const prevReal = realRecordsFor(prev.id), thisReal = realRecordsFor(m.id);
    if(prevReal && thisReal){ keep.set(k+"|"+m.id, m); continue; }  /* both real: leave alone */
    if(!prevReal && thisReal){ remap[prev.id] = m.id; keep.set(k, m); }
    else { remap[m.id] = prev.id; }
  }
  const survivors = [...keep.values()];
  if(survivors.length === (S.members||[]).length) return false;
  (S.observations||[]).forEach(o=>{ if(remap[o.memberId]) o.memberId = remap[o.memberId]; });
  (S.actions||[]).forEach(a=>{ if(remap[a.memberId]) a.memberId = remap[a.memberId]; });
  Object.keys(remap).forEach(id=>tombstone("m", id));
  S.members = survivors;
  if(!S.members.some(m=>m.id===who) && S.members.length) who = S.members[0].id;
  save();
  return true;
}
function ensurePerson(){
  if((S.members||[]).length) return;
  S.members = [{id:"m-"+String((AUTH&&AUTH.uid)||"local").replace(/-/g,"").slice(0,10),
    name:"Me", sex:"female", dob:"", population:"asian_pacific", country:"", mtime:Date.now()}];
  who = S.members[0].id;
}
function dropExamples(){
  const had=(S.observations||[]).some(isSample)||(S.actions||[]).some(isSample)||(S.members||[]).some(isSample);
  if(!had) return false;
  S.observations=(S.observations||[]).filter(o=>!isSample(o));
  S.actions=(S.actions||[]).filter(a=>!isSample(a));
  S.members=(S.members||[]).filter(m=>!isSample(m));
  if(S.members.length && !S.members.some(m=>m.id===who)) who=S.members[0].id;
  save(); return true;
}

/* Keep the account copy current without anyone pressing a button. */
let syncTimer=null;
function queueSync(){
  if(!AUTH || IS_ARTIFACT || syncing) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){ if(!syncing) syncNow(true); }, 2500);
}

async function syncNow(quiet){
  if(syncing) return;
  if(IS_ARTIFACT){
    syncMsg = {t:"amber", k:"Sync does not run in this copy",
      x:"The claude.ai viewer blocks a page from reaching an outside server, so this copy is local-only by platform rule, not by choice. Open the same book at ttrng3.github.io/famrec to sync."};
    render(); return;
  }
  if(!syncConfigured()){
    syncMsg = {t:"amber", k:"Sync is not wired up", x:"No database address was built into this copy of the page."};
    render(); return;
  }
  if(!AUTH){
    syncMsg = {t:"amber", k:"Not signed in", x:"Sign in below, then sync will run."};
    render(); return;
  }
  syncing = true;
  if(!quiet){ syncMsg = {t:"blue", k:"Syncing", x:"Reading what the other device left."}; render(); }
  const q = "/rest/v1/famrec_state?select=doc,updated_at&user_id=eq." + encodeURIComponent(AUTH.uid);
  let changed = false;
  try{
    let r = await supa(q);
    if(r.status===401){
      if(await renewSession()) r = await supa(q);
      else { AUTH=null; saveAuth(); throw new Error("Your sign-in expired. Sign in again."); }
    }
    if(!r.ok){
      const code = r.body && r.body.code;
      if(code==="PGRST205" || (r.body && /famrec_state/.test(r.body.message||"")))
        throw new Error("The sync table does not exist yet. Run 0010_famrec_sync.sql in the Supabase SQL editor, then try again.");
      throw new Error((r.body&&(r.body.message||r.body.hint))||("The database refused the read (HTTP "+r.status+")."));
    }
    let remote = (r.body && r.body[0] && r.body[0].doc) || null;
    if(remote){
      remote.observations = (remote.observations||[]).filter(o=>!isSample(o));
      remote.actions      = (remote.actions||[]).filter(a=>!isSample(a));
      remote.members      = (remote.members||[]).filter(m=>!isSample(m));
    }
    const real = x => (x||[]).filter(r=>!isSample(r)).length;
    const before = real(S.observations);
    const merged = syncMerge(S, remote);
    if(merged.members.length) S.members = merged.members;
    S.observations = merged.observations;
    S.actions = merged.actions;
    S.reports = merged.reports;
    S.customCodes = merged.customCodes;
    if(merged.panel && merged.panel.length) S.panel = merged.panel;
    S.tomb = merged.tomb;
    if(S.members.length && !S.members.some(m=>m.id===who)) who = S.members[0].id;
    if(dedupePeople()) changed = true;
    ensurePerson();
    save();
    const keptMembers = S.members.filter(m=>!isSample(m));
    const up = await supa("/rest/v1/famrec_state", {method:"POST",
      headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},
      body:[{user_id:AUTH.uid, device:(navigator.platform||"device"),
             doc:{v:2, members:keptMembers,
                  observations:S.observations.filter(o=>!isSample(o)),
                  actions:S.actions.filter(a=>!isSample(a)),
                  reports:S.reports||[], customCodes:S.customCodes||{},
                  panel:S.panel||[], tomb:S.tomb}}]});
    if(!up.ok) throw new Error((up.body&&(up.body.message||up.body.hint))
      ||("The database refused the write (HTTP "+up.status+")."));
    const after = real(S.observations);
    const gained = after - before;
    changed = gained !== 0;
    const samples = (S.observations||[]).length - after;
    S.lastSync = new Date().toISOString();
    save();
    if(!quiet) syncMsg = {t:"green", k:"Synced",
      x:(gained>0 ? gained+" reading"+(gained===1?"":"s")+" arrived from your other device. "
                  : "Everything already matched. ")
        +"Your devices share "+after+" reading"+(after===1?"":"s")+"."
        +(samples? " The "+samples+" example records are local scaffolding and deliberately do not sync — clear them when you are done looking.":"")};
  }catch(e){
    changed = true;
    const offline = e && /Failed to fetch|NetworkError|Load failed/i.test(e.message||"");
    syncMsg = {t:"red",
      k: offline ? "Could not reach the database" : "Sync did not complete",
      x: offline
        ? "No answer from the server. Either this device is offline, or the Supabase project has paused — the free plan pauses a project after seven days without traffic and it takes one click in the dashboard to resume. Nothing is lost: this device still holds every record."
        : (e.message || String(e))};
  }
  syncing = false;
  /* A background sync that found nothing must not repaint the page: a repaint
     mid-keystroke costs the caret and whatever was half-typed. */
  if(!quiet || changed) render();
}



/* ================================================== dropping a report in
   A website's natural gesture is to drag the file onto the page, so the page
   takes a drop anywhere, a paste from the clipboard, and a click on the
   target. Nothing is read here: every page goes to the extractor. */
let dragDepth = 0;
function dropOverlay(on){ const el=document.getElementById("dropveil"); if(el) el.hidden=!on; }
window.addEventListener("dragenter", e => {
  if(!e.dataTransfer || (e.dataTransfer.types||[]).indexOf("Files") < 0) return;
  e.preventDefault(); dragDepth++; dropOverlay(true);
});
window.addEventListener("dragover", e => {
  if(!e.dataTransfer || (e.dataTransfer.types||[]).indexOf("Files") < 0) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "copy";
});
window.addEventListener("dragleave", () => { if(--dragDepth <= 0){ dragDepth = 0; dropOverlay(false); } });
window.addEventListener("drop", async e => {
  if(!e.dataTransfer) return;
  const fs = e.dataTransfer.files;
  if(!fs || !fs.length) return;
  e.preventDefault(); dragDepth = 0; dropOverlay(false);
  await handleIncomingFiles(fs);
});
window.addEventListener("paste", async e => {
  if(tab === "add" && document.activeElement &&
     /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  const cd = e.clipboardData; if(!cd) return;
  const picked = [...(cd.items||[])].filter(i => i.kind === "file").map(i => i.getAsFile()).filter(Boolean);
  if(picked.length){ e.preventDefault(); await handleIncomingFiles(picked); return; }
  const txt = cd.getData("text/plain");
  if(txt && txt.split(/\r?\n/).length >= 2){
    const out = parseReport(txt);
    out.rows.forEach(r=>{ r.confirmed=true; r.agreed=true; r.from='pasted in'; });
    if(out.rows.length){
      e.preventDefault();
      if(!draft) draft = newDraft();
      if(!draft.memberId) draft.memberId = who;
      draft.rows = draft.rows.concat(out.rows);
      draft.skipped = out.skipped;
      draft.notes = [out.rows.length + " row" + (out.rows.length===1?"":"s") + " read from what you pasted."];
      tab = "add"; render(); window.scrollTo(0,0);
    }
  }
});

function isTextFile(f){
  const t = (f.type||"").toLowerCase(), n = (f.name||"").toLowerCase();
  return t.indexOf("text/") === 0 || /\.(txt|csv|tsv)$/.test(n);
}
function isPdf(f){
  return (f.type||"").toLowerCase() === "application/pdf" || /\.pdf$/i.test(f.name||"");
}


/* ============================ extraction, via the Vitals pipeline
   This does not read documents itself. It hands them to the extract-document
   Edge Function that vitals-app already deployed, which sends the page to a
   vision model and returns structured rows.

   Why that and not OCR in the browser: the bench measured 262 matched rows
   across 8 documents at a mean confidence of 0.901 on Vietnamese files --
   slightly HIGHER than on non-Vietnamese ones (10_FINDINGS_extraction-bench.md
   §4). OCR in the browser is not in the same category and never will be.

   D16 matters here and is why the client does no name-matching of its own:
   the function discards the model's own canonical_code and re-resolves every
   row from source_test_name through the 279-alias table. "A code the model
   can't itself get exactly right isn't trusted just because it filled in the
   field." So a row that comes back WITHOUT a canonical_code is a test the
   alias table does not know -- which is the honest signal for "this needs a
   human", far better than a confidence number.

   On confidence: the bench warns against driving UI from it (§4) -- low
   scores cluster on specific causes, such as an unlabelled date capping a row
   at 0.5, rather than tracking correctness. Height and weight rows scored 0.5
   while being 100% right. So confidence is shown, not used as a gate, except
   at the very bottom of the range. */

function extFor(f){
  const t=(f.type||"").toLowerCase();
  if(t==="application/pdf") return "pdf";
  if(t==="image/png") return "png";
  if(t==="image/webp") return "webp";
  if(t==="image/heic"||t==="image/heif") return "heic";
  const m=(f.name||"").match(/\.([a-z0-9]{2,5})$/i);
  return m?m[1].toLowerCase():"jpg";
}

async function extractViaVitals(file, say){
  if(IS_ARTIFACT) throw new Error("this copy cannot reach the extractor — open ttrng3.github.io/famrec");
  if(!AUTH || !AUTH.uid) throw new Error("sign in first — extraction runs under your own account");

  const path = AUTH.uid + "/famrec-" + Date.now() + "-" + uid() + "." + extFor(file);
  const mime = file.type || "application/octet-stream";

  say && say("Uploading the page");
  let up = await fetch(SUPA.url + "/storage/v1/object/documents/" + path, {
    method: "POST",
    headers: {apikey: SUPA.key, Authorization: "Bearer " + AUTH.tok,
              "Content-Type": mime, "x-upsert": "true"},
    body: file
  });
  if(up.status === 401 && await renewSession()){
    up = await fetch(SUPA.url + "/storage/v1/object/documents/" + path, {
      method: "POST",
      headers: {apikey: SUPA.key, Authorization: "Bearer " + AUTH.tok,
                "Content-Type": mime, "x-upsert": "true"},
      body: file });
  }
  if(!up.ok){
    let why = ""; try{ const j = await up.json(); why = j.message || j.error || ""; }catch(e){}
    throw new Error("the page could not be uploaded (HTTP " + up.status + (why ? ": " + why : "") + ")");
  }

  say && say("Registering it");
  const ins = await supa("/rest/v1/documents", {method: "POST",
    headers: {Prefer: "return=representation"},
    body: [{storage_path: path, mime_type: mime}]});
  if(!ins.ok || !ins.body || !ins.body[0] || !ins.body[0].id)
    throw new Error((ins.body && (ins.body.message || ins.body.hint)) || "the document row could not be created");
  const documentId = ins.body[0].id;

  say && say("Reading it — this takes a few seconds");
  const r = await fetch(SUPA.url + "/functions/v1/extract-document", {
    method: "POST",
    headers: {apikey: SUPA.key, Authorization: "Bearer " + AUTH.tok, "Content-Type": "application/json"},
    body: JSON.stringify({documentId: documentId})
  });
  let out = null; try{ out = await r.json(); }catch(e){}
  if(!r.ok) throw new Error((out && out.error) || ("the extractor refused it (HTTP " + r.status + ")"));
  return {rows: (out && out.rows) || [], documentId: documentId, path: path};
}

/* Model rows -> the shape this book stores. The range comes back as a pair
   plus an operator, because a report prints "< 5.2" as often as "3.9 - 6.4". */
function rowsFromVitals(vrows, fileName){
  const out = [];
  for(const v of (vrows||[])){
    if(v.value_raw === null || v.value_raw === undefined || String(v.value_raw).trim() === "") continue;
    const known = !!v.canonical_code;
    const code = known ? v.canonical_code : slug(v.source_test_name || "unknown");
    const unit = normUnit(v.unit_raw || "") || meta(code).u || (v.unit_raw || "");
    const op = v.ref_operator;
    let lo = v.ref_low, hi = v.ref_high, label = "";
    if(op === "<" || op === "<="){ hi = (hi !== null && hi !== undefined) ? hi : lo; lo = ""; label = (op==="<"?"< ":"≤ ") + hi; }
    else if(op === ">" || op === ">="){ lo = (lo !== null && lo !== undefined) ? lo : hi; hi = ""; label = (op===">"?"> ":"≥ ") + lo; }
    else if(lo !== null && lo !== undefined && hi !== null && hi !== undefined) label = lo + "–" + hi;
    const conf = (v.confidence === null || v.confidence === undefined) ? 1 : Number(v.confidence);

    out.push({
      code: code,
      value: String(v.value_raw).trim(),
      unit: unit,
      refLow: (lo === null || lo === undefined) ? "" : String(lo),
      refHigh: (hi === null || hi === undefined) ? "" : String(hi),
      refLabel: label ? label + (unit ? " " + unit : "") : "",
      newName: known ? "" : (v.source_test_name || ""),
      src: (v.source_test_name || "") + (v.unit_raw ? "  " + v.unit_raw : ""),
      from: fileName,
      confidence: conf,
      collectedAt: v.collected_at || "",
      /* accepted when the alias table recognised the test and the reader was
         not at the very bottom of its own scale; flagged otherwise */
      agreed: known && conf >= 0.4,
      confirmed: known && conf >= 0.4,
      why: !known ? "this test is not in the alias table, so it has not been matched to anything"
                  : (conf < 0.4 ? "the reader was unsure of this row" : "")
    });
  }
  return out;
}

/* ============================================ many files, one report
   A visit produces several pages, and people drop the lot at once. Every file
   is kept, every one is read if it can be, and the rows they yield all land in
   the same confirm queue. */

function fileKind(f){
  const t = (f.type||"").toLowerCase(), n = (f.name||"").toLowerCase();
  if(t.indexOf("text/") === 0 || /\.(txt|csv|tsv)$/.test(n)) return "text";
  if(t === "application/pdf" || /\.pdf$/.test(n)) return "pdf";
  if(t.indexOf("image/") === 0 || /\.(jpe?g|png|heic|heif|webp|gif|bmp|tiff?)$/.test(n)) return "image";
  return "other";
}

async function addOneFile(f){
  const kind = fileKind(f);
  if(kind === "other"){
    return {skipped:true, name:f.name, why:"not a report — only photos, PDFs and text files can be read"};
  }
  if(kind === "text"){
    let txt = ""; try{ txt = await f.text(); }catch(e){}
    const out = parseReport(txt);
    draft.rows = draft.rows.concat(out.rows);
    return {rows:out.rows.length, name:f.name, kind:kind};
  }
  const id = uid(), stored = await putFile(id, f);
  const entry = {id:stored?id:null, name:f.name, type:f.type||"", size:f.size||0,
                 url: kind==="image" ? URL.createObjectURL(f) : null,
                 kind:kind, ok:false, rows:0, note:""};
  draft.files.push(entry);
  return {entry:entry, file:f, kind:kind, name:f.name};
}

/* Every page goes to the extractor; nothing is read in this browser. */
async function readQueue(pending){
  for(let i = 0; i < pending.length; i++){
    const p = pending[i];
    if(!p.entry) continue;
    const where = pending.length > 1 ? " (" + (i+1) + " of " + pending.length + ")" : "";
    try{
      const res = await extractViaVitals(p.file, msg => {
        draft.busy = msg + where + "\u2026";
        const el = document.getElementById("busyline"); if(el) el.textContent = draft.busy;
        render();
      });
      const rows = rowsFromVitals(res.rows, p.name);
      draft.rows = draft.rows.concat(rows);
      p.entry.rows = rows.length;
      p.entry.docId = res.documentId;
      const flagged = rows.filter(r => !r.agreed).length;
      p.entry.note = rows.length
        ? rows.length + " value" + (rows.length===1?"":"s") + " read" + (flagged ? ", " + flagged + " to check" : "")
        : "no test results found on this page";
      const d = rows.map(r=>r.collectedAt).find(x=>/^\d{4}-\d{2}-\d{2}$/.test(x||""));
      if(d && draft.date === today()) draft.date = d;
    }catch(e){
      const m = String((e && e.message) || e);
      p.entry.note = /Failed to fetch|NetworkError|Load failed/i.test(m)
        ? "could not reach the extractor \u2014 either this device is offline, or the Supabase project has paused (the free plan pauses after seven days idle; one click in the dashboard resumes it). The page is still attached."
        : "could not be read \u2014 " + m;
    }
    render();
  }
  draft.busy = "";
  render();
}


async function handleIncomingFiles(list){
  const files = [...(list||[])].filter(Boolean);
  if(!files.length) return;
  if(!draft) draft = newDraft();
  if(!draft.memberId) draft.memberId = who;
  tab = "add"; draft.busy = "Taking in " + files.length + " file" + (files.length===1?"":"s") + "…";
  render(); window.scrollTo(0,0);

  const pending = [], notes = [];
  for(const f of files){
    const r = await addOneFile(f);
    if(r.skipped) notes.push(r.name + " — " + r.why);
    else if(r.entry) pending.push(r);
    else if(r.rows !== undefined) notes.push(r.name + " — " + r.rows + " row" + (r.rows===1?"":"s") + " read");
  }
  draft.notes = notes;
  render();
  if(pending.length) await readQueue(pending);
}
/* one file, same path */
async function handleIncomingFile(f){ return handleIncomingFiles(f ? [f] : []); }

/* Four tabs, five only when the book holds more than one person. "Add a
   report" was both a tab and a button on the same screen, which is one way of
   doing a thing too many; it is a screen you enter and leave, not a place. */
function tabList(){
  const t=[];
  if((S.members||[]).length>1) t.push(["overview","Family"]);
  t.push(["record","Results"],["trends","Trends"],["actions","Questions"],["settings","Settings"]);
  return t;
}
function paintTabs(){
  const m=person(who);

  document.getElementById("tabs").innerHTML=tabList().map(t=>
    '<button class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+esc(t[1])+
    (c[t[0]]?'<span class="c">'+c[t[0]]+'</span>':'')+'</button>').join("");
}
function paintPeople(){
  document.getElementById("people").innerHTML=S.members.map(m=>
    '<button class="pbtn" data-p="'+esc(m.id)+'" aria-pressed="'+(m.id===who)+'">'+
    (m.id===who?'<span class="dot"></span>':'')+esc(m.name)+'</button>').join("");
}
function render(){
  paintPeople(); paintTabs();
  document.getElementById("view").innerHTML =
    tab==="overview"?vOverview(): tab==="record"?vRecord(): tab==="trends"?vTrends():
    tab==="actions"?vActions(): tab==="add"?vAdd(): tab==="handoff"?vHandoff(): vSettings();
  drawer();

}
function wireChart(){
  const ch=document.querySelector(".chart"); if(!ch) return;
  const tip=document.getElementById("tip"), m=person(who), pts=series(m.id,trendCode), M=meta(trendCode);
  ch.querySelectorAll(".pt").forEach(c=>{
    const show=()=>{ const p=pts[+c.dataset.i]; if(!p) return;
      const r=ch.getBoundingClientRect(), cr=c.getBoundingClientRect();
      tip.innerHTML='<b>'+esc(p.observedAt||"no date")+'</b><br>'+esc(p.valueRaw||fmt(p.value))+' '+esc(p.unit)+
        (p.unit!==M.u?' ('+fmt(p.value)+' '+esc(M.u)+')':'')+'<br>'+esc(ST[statusOf(p)])+'<br>'+esc(p.source||"lab not recorded");
      tip.hidden=false;
      tip.style.left=Math.max(4,Math.min(cr.left-r.left+cr.width/2-tip.offsetWidth/2,r.width-tip.offsetWidth-4))+"px";
      tip.style.top=Math.max(4,cr.top-r.top-tip.offsetHeight-10)+"px"; };
    const hide=()=>{ tip.hidden=true; };
    c.addEventListener("mouseenter",show); c.addEventListener("focus",show);
    c.addEventListener("mouseleave",hide); c.addEventListener("blur",hide);
  });
}

async function saveFile(filename, data){
  try{
    if(window.claude && typeof window.claude.use==="function"){
      const d = await window.claude.use("downloads");
      if(d && typeof d.save==="function"){ await d.save({filename, data}); return true; }
    }
  }catch(e){ /* declined or unavailable — fall through to the plain path */ }
  try{
    const b=new Blob([data],{type:"application/json"});
    const u=URL.createObjectURL(b), a=document.createElement("a");
    a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>{ try{ URL.revokeObjectURL(u); }catch(e){} },1000);
    return true;
  }catch(e){ return false; }
}
function doImport(raw){
  const msg=document.getElementById("impMsg");
  const label=(document.getElementById("impFrom").value||"").trim();
  if(!raw||!raw.trim()){ return; }
  let p; try{ p=JSON.parse(raw); }catch(e){
    msg.innerHTML='<div class="callout c-red" style="margin-top:var(--s3)"><div class="kick">Could not read that</div><p>It is not a Vitals Journal hand-off. Copy the whole block, from the first <span class="mono">{</span> to the last <span class="mono">}</span>.</p></div>'; return; }
  let r; try{ r=mergeIn(p,label?("from "+label+", "+today()):""); }
  catch(e){ msg.innerHTML='<div class="callout c-red" style="margin-top:var(--s3)"><div class="kick">Not a hand-off file</div><p>'+esc(e.message)+'</p></div>'; return; }
  save();
  msg.innerHTML='<div class="callout c-green" style="margin-top:var(--s3)"><div class="kick">Merged</div><p>'+
    r.addedO+' reading'+(r.addedO===1?'':'s')+' added'+(r.dupO?', '+r.dupO+' already here and skipped':'')+
    (r.addedM?', '+r.addedM+' new person'+(r.addedM===1?'':'s'):'')+
    (r.addedA?', '+r.addedA+' follow-up'+(r.addedA===1?'':'s'):'')+'. Nothing was overwritten.</p></div>';
  document.getElementById("impBox").value="";
  paintPeople(); paintTabs();
}

document.addEventListener("input", e=>{
  const el=e.target;
  if(draft && el.dataset && el.dataset.f!==undefined){
    const r=draft.rows[+el.dataset.i]; if(!r) return;
    r[el.dataset.f]=el.value;
    if(el.dataset.f==="refLow"||el.dataset.f==="refHigh"||el.dataset.f==="unit"){
      r.refLabel=(r.refLow!==""&&r.refHigh!=="")?r.refLow+"–"+r.refHigh+" "+r.unit:(r.refHigh!==""?"≤ "+r.refHigh+" "+r.unit:(r.refLow!==""?"≥ "+r.refLow+" "+r.unit:""));
    }
    r.confirmed = true;  /* a value you just typed is one you have looked at */
    return;
  }
  if(el.dataset && el.dataset.mf){ const m=person(el.dataset.mid); if(!m) return;
    m[el.dataset.mf]=el.value; touch(m); save(); paintPeople(); return; }
  if(draft){
    if(el.id==="dWho") draft.memberId=el.value;
    else if(el.id==="dDate") draft.date=el.value;
    else if(el.id==="dSrc") draft.source=el.value;
    else if(el.id==="dFast") draft.fasting=el.value;
    else if(el.id==="dSpec") draft.specimen=el.value;
  }
});

document.addEventListener("change", async e=>{
  const el=e.target;
  if(draft && el.dataset && el.dataset.ck!==undefined){
    const r=draft.rows[+el.dataset.ck]; if(!r) return;
    if(el.checked && !isFinite(parseFloat(r.value))){ el.checked=false; alert("Type the value before confirming it."); return; }
    r.confirmed=el.checked; el.closest(".crow").classList.toggle("ok",el.checked);
    const ready=draft.rows.length>0&&draft.rows.every(x=>x.confirmed);
    const b=document.getElementById("saveDraft"); if(b) b.disabled=!ready;
    const bd=document.querySelector(".card .badge.st-in_range, .card .badge.st-watch");
    if(bd){ const n=draft.rows.filter(x=>x.confirmed).length;
      bd.className="badge "+(ready?"st-in_range":"st-watch");
      bd.innerHTML='<span class="dot"></span>'+n+' of '+draft.rows.length+' checked'; }
    return;
  }
  if(el.dataset && el.dataset.act){ const a=S.actions.find(x=>x.id===el.dataset.act); if(!a) return;
    a.done=el.checked; touch(a); save(); render(); return; }
  if(el.id==="trendSel"){ trendCode=el.value; render(); return; }
  if(el.id==="impFile"){ const f=el.files&&el.files[0]; if(!f) return;
    try{ doImport(await f.text()); }catch(err){ alert("Could not read that file."); } return; }
  if(el.id==="globalPick"){ const fs=el.files; const copy=fs?[...fs]:[]; el.value=""; if(copy.length) await handleIncomingFiles(copy); return; }

});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&detail){ detail=null; drawer(); } });

/* print: CSS cannot open a <details>, so do it here */
(function(){var r=[];function o(){r=[];document.querySelectorAll("details:not([open])").forEach(function(d){r.push(d);d.open=true});}
function c(){r.forEach(function(d){d.open=false});r=[];}
window.addEventListener("beforeprint",o);window.addEventListener("afterprint",c);
if(window.matchMedia){var m=window.matchMedia("print"),h=function(v){v.matches?o():c()};
m.addEventListener?m.addEventListener("change",h):m.addListener(h);}})();

function start(){
  S=load(); S.reports=S.reports||[]; S.actions=S.actions||[];
  S.tomb=S.tomb||{o:[],a:[],m:[]}; S.tomb.p=S.tomb.p||[];
  S.customCodes=S.customCodes||{};
  if(!Array.isArray(S.panel)) S.panel=DEFAULT_PANEL.slice();
  applyText();
  loadAuth();
  if(AUTH) dropExamples();
  ensurePerson();
  who=S.members[0].id;
  const d=document.createElement("div"); d.id="dHost"; document.body.appendChild(d);
  render();
  if(IS_ARTIFACT) return;
  (async function(){
    const arrived = await consumeSignInLink();
    if(arrived){ tab="handoff"; render(); }
    if(AUTH) await syncNow();
  })();
}
start();
</script>
